name: Build Phantom OS
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/dashboard.test.cjs
      - run: python -m pip install platformio==6.1.18
      - run: pio run -e nodemcuv2
      - run: pio run -e nodemcuv2 -t buildfs
      - uses: actions/upload-artifact@v4
        with:
          name: phantom-os-esp8266
          path: |
            .pio/build/nodemcuv2/firmware.bin
            .pio/build/nodemcuv2/littlefs.bin
          if-no-files-found: error
