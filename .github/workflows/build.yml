name: Build Phantom OS
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/dashboard.test.cjs
      - run: python -m pip install platformio==6.1.18
      - run: pio run -e nodemcuv2
      - run: pio run -e nodemcuv2 -t buildfs
      - name: Record development image hashes and sizes
        run: |
          cd .pio/build/nodemcuv2
          sha256sum firmware.bin littlefs.bin
          wc -c firmware.bin littlefs.bin
